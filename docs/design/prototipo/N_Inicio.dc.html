<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SonicMaster - sem pedaleira (novo design)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#3E2C28}
button{font-family:inherit;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid #DF9D8E;outline-offset:2px}
</style>
</helmet>
<div style="{{themeVars}} width: 1180px; height: 820px; box-sizing: border-box; background: var(--bg); color: var(--text); font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--head); border-bottom: 1px solid var(--line)">
<div style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; margin-right: 10px">sonic<span style="color: {{accent}}">master</span></div>
<button type="button" disabled aria-label="Preset anterior" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--ctrl); color: #4F5754; opacity: 0.6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 10px; width: 230px; height: 36px; padding: 0 12px; box-sizing: border-box; background: var(--ctrl); border-radius: 10px; opacity: 0.6">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted)">---</span>
</div>
<button type="button" disabled aria-label="Próximo preset" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--ctrl); color: #4F5754; opacity: 0.6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
<div style="flex: 1"></div>
<button type="button" disabled aria-label="Afinador" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #4F5754"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 17a8 8 0 1 1 16 0"></path><path d="M12 17l4-6"></path></svg></button>
<button type="button" disabled aria-label="Presets da comunidade" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #4F5754"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"></path></svg></button>
<button type="button" disabled aria-label="Ajustes" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #4F5754"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></button>
<button type="button" disabled style="height: 36px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--ctrl); color: var(--muted); font-size: 13px; font-weight: 600">Salvar</button>
<div style="display: flex; align-items: center; gap: 8px; margin-left: 6px; padding-left: 12px; border-left: 1px solid var(--line)">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #FF4D42"></span>
<span style="font-size: 13px; color: var(--text2)">Desconectada</span>
<button type="button" style="height: 32px; margin-left: 4px; padding: 0 14px; border: 0; border-radius: 10px; background: {{accent}}; color: var(--onacc); font-size: 13px; font-weight: 600; cursor: pointer">Conectar</button>
</div>
</header>

<div style="flex: 1; display: flex; min-height: 0">

<aside aria-hidden="true" style="width: 210px; flex: none; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line)">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; margin: 12px 12px 10px; padding: 3px; background: var(--ctrl); border-radius: 10px; opacity: 0.5">
<span style="height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted)">Fábrica</span>
<span style="height: 30px; border-radius: 8px; background: var(--sel); display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text2)">Usuário</span>
</div>
<div style="padding: 0 12px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{skeleton}}" as="sk" hint-placeholder-count="12"><span style="{{sk}}"></span></sc-for>
</div>
</aside>

<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<section aria-label="Pedaleira vazia" style="height: 210px; flex: none; position: relative; box-sizing: border-box; padding: 0 14px; background: var(--side); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: center">
<div style="position: absolute; left: 24px; right: 24px; top: 92px; height: 2px; background: #1C1D21"></div>
<div style="position: relative; display: flex; align-items: center; gap: 12px">
<sc-for list="{{slots}}" as="sl" hint-placeholder-count="9">
<div style="display: flex; flex-direction: column; align-items: center; padding: 6px">
<span style="{{sl.box}}"></span>
<span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted); margin-top: 8px">{{sl.tag}}</span>
</div>
</sc-for>
</div>
</section>

<section style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke-width="1.4" aria-hidden="true" style="stroke: var(--muted)"><rect x="6" y="3" width="12" height="18" rx="2.5"></rect><circle cx="12" cy="15" r="2.5"></circle><path d="M9 7h6"></path><path d="M3 3l18 18"></path></svg>
<p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600; color: var(--text)">Nenhuma pedaleira conectada</p>
<button type="button" style="height: 44px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--ctrl); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer">Testar demo</button>
</section>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#DF9D8E","options":["#DF9D8E","#D9AB9A","#9FBF8F","#9FAD9F"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.__listen();
  }
  // The app colour chosen in Aparência, shared by every screen (saved in this browser).
  __listen() {
    var self = this;
    try {
      window.addEventListener('storage', function (e) { if (e.key === 'sm_tema') self.setState({ __tema: e.newValue }); });
      window.addEventListener('sm_tema', function (e) { self.setState({ __tema: e.detail }); });
    } catch (e) {}
  }
  __theme() {
    var THEMES = [{id:'vintage',c:['#3E2C28','#45322D','#4A3530','#513A35','#573E39','#5E443E','#694B45','#74534C','#835E56','#F0ECE9','#E1D9D2','#D0C7C3','#9FBF8F','#DF9D8E','#312320','#D0C7C3','#FFFFFF']},{id:'p1',c:['#392F22','#403426','#443828','#4B3D2C','#504230','#574733','#614F39','#6B5840','#796348','#F9F9FB','#F4F3F6','#CEC9C6','#9FBF8F','#D8A86A','#2E251B','#CEC9C6','#FFFFFF']},{id:'p2',c:['#3A2F1A','#41341E','#453820','#4C3D23','#524225','#594728','#63502D','#6D5832','#7B6338','#F3EBE1','#E5D2BC','#D4C7B6','#9FBF8F','#C3AC84','#2F2515','#D4C7B6','#FFFFFF']},{id:'p3',c:['#2F3315','#343917','#383D19','#3D421B','#42471D','#484D21','#50562B','#595E36','#656A45','#FAF5DE','#F5EABD','#CECAAA','#9FBF8F','#FF8C8C','#262911','#CECAAA','#FFFFFF']},{id:'p4',c:['#422A26','#4A2F2B','#4F332D','#573732','#5D3C36','#65413A','#714841','#7D5048','#8D5A51','#F1F4E6','#E4E9CD','#D0CABC','#9FBF8F','#D5A49C','#35221F','#D0CABC','#FFFFFF']},{id:'p5',c:['#4D2521','#552A26','#582E2B','#5D3431','#613A36','#66403D','#6E4946','#755350','#7F5F5C','#FFFDFF','#FEFBFF','#D2C5C6','#9FBF8F','#FFAACF','#3E1D1B','#D2C5C6','#FFFFFF']},{id:'p6',c:['#3E2C28','#45322D','#4A3530','#513A35','#573E39','#5E443E','#694B45','#74534C','#835E56','#F0ECE9','#E1D9D2','#D0C7C3','#9FBF8F','#DF9D8E','#312320','#D0C7C3','#FFFFFF']},{id:'p7',c:['#303126','#36372A','#393B2D','#3F4031','#444635','#494B3A','#525440','#5B5D47','#666950','#F6F7FA','#EDEEF5','#C7C8C7','#9FBF8F','#B8BF80','#26271E','#C7C8C7','#FFFFFF']},{id:'p8',c:['#482727','#502C2C','#543030','#583636','#5D3B3B','#624141','#694B4B','#715454','#7B6060','#EEECEB','#D9D5D1','#CFC6C4','#9FBF8F','#BDA9AC','#3A1F1F','#CFC6C4','#FFFFFF']},{id:'p9',c:['#48272D','#502B32','#562E35','#5E333A','#65373F','#6D3B44','#7A424C','#874954','#95545F','#EFECEC','#D9D2D2','#D3C7C9','#9FBF8F','#D2A1AA','#3A1F24','#D3C7C9','#FFFFFF']},{id:'p10',c:['#353027','#3B362C','#3F392F','#453F33','#4A4337','#50493B','#595242','#635A49','#706653','#F4EBE1','#E6D2BC','#D0C6B9','#9FBF8F','#D9BC9A','#2A261F','#D0C6B9','#FFFFFF']},{id:'p11',c:['#45282D','#4D2D33','#513136','#56373C','#5A3C41','#5F4247','#674B50','#6F5459','#796165','#E9F2F1','#D4E5E3','#C8C9C9','#9FBF8F','#DE9DB2','#372024','#C8C9C9','#FFFFFF']},{id:'p12',c:['#4B2623','#532B27','#592D29','#61322D','#693531','#713A35','#7E403B','#8C4741','#9E5049','#F3EBE2','#E4D2BE','#D7C4BA','#9FBF8F','#EE9898','#3C1F1C','#D7C4BA','#FFFFFF']},{id:'p13',c:['#541E2B','#592532','#5D2A36','#61303C','#663641','#6B3C48','#724651','#7A4F5A','#835C66','#F1F1E8','#E4E3D1','#D1C6C1','#9FBF8F','#C4A8AF','#441823','#D1C6C1','#FFFFFF']},{id:'p14',c:['#432B20','#4B3023','#503326','#573829','#5E3C2C','#664130','#724836','#7E503B','#875D4A','#F0EFEF','#E1DEDF','#CFC5C2','#9FBF8F','#D8B483','#362219','#CFC5C2','#FFFFFF']},{id:'p15',c:['#2F3037','#34363E','#383A42','#3D3F48','#42444E','#474954','#4F525E','#585B68','#636676','#FFFCF2','#FFF9E5','#CCCAC2','#9FBF8F','#EE9872','#25272C','#CCCAC2','#FFFFFF']},{id:'p16',c:['#26323C','#2C3741','#303B45','#36414A','#3B454F','#414B54','#4A545C','#535C65','#5F686F','#F7F7F7','#EFEFEF','#C6C9CB','#9FBF8F','#C6A8A5','#1D2831','#C6C9CB','#FFFFFF']},{id:'p17',c:['#402D16','#483219','#4D351A','#543A1D','#5A3F1F','#624422','#6D4C25','#79542A','#875F30','#FAF9F0','#F5F3E1','#D2C9B7','#9FBF8F','#C9AB89','#332412','#D2C9B7','#FFFFFF']}];
    var KEYS = ['bg', 'side', 'head', 'card', 'field', 'ctrl', 'line', 'line2', 'sel', 'text', 'text2', 'muted', 'ok', 'acc', 'onacc', 'faint', 'strong'];
    var saved = null;
    try { saved = localStorage.getItem('sm_tema'); } catch (e) {}
    var id = (this.state && this.state.__tema) || this.props.tema || saved || 'vintage';
    var t = THEMES.filter(function (x) { return x.id === id; })[0] || THEMES[0];
    return { accent: t.c[13], vars: KEYS.map(function (k, i) { return '--' + k + ': ' + t.c[i] + ';'; }).join(' ') };
  }

  renderVals() {
    var __th = this.__theme();
    var slot = function (tag, w, h) {
      return { tag: tag, box: 'display: block; box-sizing: border-box; width: ' + w + 'px; height: ' + h + 'px; border: 1.5px dashed #323A37; border-radius: 9px; background: #191D1C;' };
    };
    var widths = [86, 70, 112, 60, 74, 100, 90, 64, 80];
    return { themeVars: __th.vars,
      accent: this.props.accent ?? 'var(--acc)',
      slots: [slot('NR', 66, 114), slot('FX1', 66, 114), slot('DRV', 66, 114), slot('AMP', 118, 76), slot('IR', 88, 92), slot('EQ', 66, 114), slot('FX2', 66, 114), slot('DLY', 66, 114), slot('RVB', 66, 114)],
      skeleton: widths.concat([96, 72, 84]).map(function (w) { return 'display: block; height: 28px; border-radius: 8px; background: linear-gradient(90deg, #1D2221 ' + w + '%, transparent ' + w + '%);'; })
    };
  }
}
</script>
</body>
</html>

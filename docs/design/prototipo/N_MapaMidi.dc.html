<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SonicMaster - mapa MIDI personalizado (novo design)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#3E2C28}
button{font-family:inherit;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:2px solid #DF9D8E;outline-offset:2px}
</style>
</helmet>
<div style="{{themeVars}} position: relative; width: 1180px; height: 820px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, sans-serif">
<div style="position: absolute; inset: 0"><dc-import name="N_Principal" accent="{{accent}}" hint-size="1180px,820px"></dc-import></div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">

<div role="dialog" aria-modal="true" aria-labelledby="mm-title" style="width: 760px; box-sizing: border-box; padding: 24px; background: var(--card); border: 1px solid var(--line2); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--ctrl); color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="8" cy="11" r="1"></circle><circle cx="16" cy="11" r="1"></circle><circle cx="12" cy="8" r="1"></circle><circle cx="9.5" cy="15" r="1"></circle><circle cx="14.5" cy="15" r="1"></circle></svg></span>
<h2 id="mm-title" style="margin: 0; flex: 1; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Mapa MIDI personalizado</h2>
<span role="status" style="font-size: 13px; color: var(--text2)"><span style="font-family: 'JetBrains Mono', monospace">{{countText}}</span> linhas · <span style="color: {{accent}}">Ainda não salvo</span></span>
</div>

<div style="background: var(--head); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 12px; height: 28px; padding: 0 10px">
<span style="width: 72px; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted)">ORIGEM</span>
<span style="flex: 1; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted)">FUNÇÃO</span>
<span style="width: 120px; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted)">OPÇÃO</span>
<span style="width: 32px"></span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 4px 0 10px; border-radius: 10px; background: var(--field)">
<span style="width: 72px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{accent}}">{{r.src}}</span>
<span style="flex: 1; font-size: 14px">{{r.fn}}</span>
<span style="width: 120px; font-size: 13px; color: var(--text2)">{{r.opt}}</span>
<button type="button" onClick="{{r.remove}}" aria-label="{{r.removeAria}}" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted)">NOVA LINHA</span>
<div style="display: flex; align-items: flex-end; gap: 8px">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="{{f.id}}" style="font-size: 12px; color: var(--text2)">{{f.label}}</label>
<button type="button" id="{{f.id}}" onClick="{{f.next}}" aria-label="{{f.aria}}" style="{{f.style}}"><span>{{f.value}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" aria-hidden="true" style="stroke: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</sc-for>
<button type="button" onClick="{{add}}" style="{{addStyle}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{addLabel}}</button>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line)">
<button type="button" style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: {{accent}}; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg>Ler de novo</button>
<div style="display: flex; gap: 10px">
<button type="button" style="height: 44px; min-width: 110px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--ctrl); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer">Fechar</button>
<button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: {{accent}}; color: var(--onacc); font-size: 14px; font-weight: 600; cursor: pointer">Salvar na pedaleira</button>
</div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#DF9D8E","options":["#DF9D8E","#D9AB9A","#9FBF8F","#9FAD9F"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  // The app colour chosen in Aparência, shared by every screen (saved in this browser).
  __listen() {
    var self = this;
    try {
      window.addEventListener('storage', function (e) { if (e.key === 'sm_tema') self.setState({ __tema: e.newValue }); });
      window.addEventListener('sm_tema', function (e) { self.setState({ __tema: e.detail }); });
    } catch (e) {}
  }
  __theme() {
    var THEMES = [{id:'vintage',c:['#3E2C28','#45322D','#4A3530','#513A35','#573E39','#5E443E','#694B45','#74534C','#835E56','#F0ECE9','#E1D9D2','#D0C7C3','#9FBF8F','#DF9D8E','#312320','#D0C7C3','#FFFFFF']},{id:'p1',c:['#392F22','#403426','#443828','#4B3D2C','#504230','#574733','#614F39','#6B5840','#796348','#F9F9FB','#F4F3F6','#CEC9C6','#9FBF8F','#D8A86A','#2E251B','#CEC9C6','#FFFFFF']},{id:'p2',c:['#3A2F1A','#41341E','#453820','#4C3D23','#524225','#594728','#63502D','#6D5832','#7B6338','#F3EBE1','#E5D2BC','#D4C7B6','#9FBF8F','#C3AC84','#2F2515','#D4C7B6','#FFFFFF']},{id:'p3',c:['#2F3315','#343917','#383D19','#3D421B','#42471D','#484D21','#50562B','#595E36','#656A45','#FAF5DE','#F5EABD','#CECAAA','#9FBF8F','#FF8C8C','#262911','#CECAAA','#FFFFFF']},{id:'p4',c:['#422A26','#4A2F2B','#4F332D','#573732','#5D3C36','#65413A','#714841','#7D5048','#8D5A51','#F1F4E6','#E4E9CD','#D0CABC','#9FBF8F','#D5A49C','#35221F','#D0CABC','#FFFFFF']},{id:'p5',c:['#4D2521','#552A26','#582E2B','#5D3431','#613A36','#66403D','#6E4946','#755350','#7F5F5C','#FFFDFF','#FEFBFF','#D2C5C6','#9FBF8F','#FFAACF','#3E1D1B','#D2C5C6','#FFFFFF']},{id:'p6',c:['#3E2C28','#45322D','#4A3530','#513A35','#573E39','#5E443E','#694B45','#74534C','#835E56','#F0ECE9','#E1D9D2','#D0C7C3','#9FBF8F','#DF9D8E','#312320','#D0C7C3','#FFFFFF']},{id:'p7',c:['#303126','#36372A','#393B2D','#3F4031','#444635','#494B3A','#525440','#5B5D47','#666950','#F6F7FA','#EDEEF5','#C7C8C7','#9FBF8F','#B8BF80','#26271E','#C7C8C7','#FFFFFF']},{id:'p8',c:['#482727','#502C2C','#543030','#583636','#5D3B3B','#624141','#694B4B','#715454','#7B6060','#EEECEB','#D9D5D1','#CFC6C4','#9FBF8F','#BDA9AC','#3A1F1F','#CFC6C4','#FFFFFF']},{id:'p9',c:['#48272D','#502B32','#562E35','#5E333A','#65373F','#6D3B44','#7A424C','#874954','#95545F','#EFECEC','#D9D2D2','#D3C7C9','#9FBF8F','#D2A1AA','#3A1F24','#D3C7C9','#FFFFFF']},{id:'p10',c:['#353027','#3B362C','#3F392F','#453F33','#4A4337','#50493B','#595242','#635A49','#706653','#F4EBE1','#E6D2BC','#D0C6B9','#9FBF8F','#D9BC9A','#2A261F','#D0C6B9','#FFFFFF']},{id:'p11',c:['#45282D','#4D2D33','#513136','#56373C','#5A3C41','#5F4247','#674B50','#6F5459','#796165','#E9F2F1','#D4E5E3','#C8C9C9','#9FBF8F','#DE9DB2','#372024','#C8C9C9','#FFFFFF']},{id:'p12',c:['#4B2623','#532B27','#592D29','#61322D','#693531','#713A35','#7E403B','#8C4741','#9E5049','#F3EBE2','#E4D2BE','#D7C4BA','#9FBF8F','#EE9898','#3C1F1C','#D7C4BA','#FFFFFF']},{id:'p13',c:['#541E2B','#592532','#5D2A36','#61303C','#663641','#6B3C48','#724651','#7A4F5A','#835C66','#F1F1E8','#E4E3D1','#D1C6C1','#9FBF8F','#C4A8AF','#441823','#D1C6C1','#FFFFFF']},{id:'p14',c:['#432B20','#4B3023','#503326','#573829','#5E3C2C','#664130','#724836','#7E503B','#875D4A','#F0EFEF','#E1DEDF','#CFC5C2','#9FBF8F','#D8B483','#362219','#CFC5C2','#FFFFFF']},{id:'p15',c:['#2F3037','#34363E','#383A42','#3D3F48','#42444E','#474954','#4F525E','#585B68','#636676','#FFFCF2','#FFF9E5','#CCCAC2','#9FBF8F','#EE9872','#25272C','#CCCAC2','#FFFFFF']},{id:'p16',c:['#26323C','#2C3741','#303B45','#36414A','#3B454F','#414B54','#4A545C','#535C65','#5F686F','#F7F7F7','#EFEFEF','#C6C9CB','#9FBF8F','#C6A8A5','#1D2831','#C6C9CB','#FFFFFF']},{id:'p17',c:['#402D16','#483219','#4D351A','#543A1D','#5A3F1F','#624422','#6D4C25','#79542A','#875F30','#FAF9F0','#F5F3E1','#D2C9B7','#9FBF8F','#C9AB89','#332412','#D2C9B7','#FFFFFF']}];
    var KEYS = ['bg', 'side', 'head', 'card', 'field', 'ctrl', 'line', 'line2', 'sel', 'text', 'text2', 'muted', 'ok', 'acc', 'onacc', 'faint', 'strong'];
    var saved = null;
    try { saved = localStorage.getItem('sm_tema'); } catch (e) {}
    var id = (this.state && this.state.__tema) || this.props.tema || saved || 'vintage';
    var t = THEMES.filter(function (x) { return x.id === id; })[0] || THEMES[0];
    return { accent: t.c[13], vars: KEYS.map(function (k, i) { return '--' + k + ': ' + t.c[i] + ';'; }).join(' ') };
  }

  constructor(props) {
    super(props);
    this.__listen();
    this.state = { gone: {}, added: [], f: { ch: 0, cc: 24, fn: 0, opt: 0 } };
  }

  renderVals() {
    var __th = this.__theme();
    var self = this;
    var gone = this.state.gone;
    var all = [
      { src: 'CC 20', fn: 'Banco − / +', opt: 'Alterna' },
      { src: 'CC 21', fn: 'Afinador liga / desliga', opt: '≥ 64 liga' },
      { src: 'CC 22', fn: 'Bloco liga / desliga', opt: 'DLY' },
      { src: 'CC 23', fn: 'Cena', opt: 'SC1' }
    ].concat(this.state.added);
    var rows = all.filter(function (r) { return !gone[r.src]; }).map(function (r) {
      return Object.assign({}, r, {
        removeAria: 'Remover linha ' + r.src,
        remove: function () { var g = Object.assign({}, gone); g[r.src] = true; self.setState({ gone: g }); }
      });
    });
    var f = this.state.f;
    var FN = ['Tap tempo', 'Afinador liga / desliga', 'Bloco liga / desliga', 'Cena', 'Banco − / +', 'Preset'];
    var OPT = ['≥ 64 liga', 'Alterna', 'DLY', 'SC1'];
    var full = rows.length >= 8;
    var field = function (id, label, value, w, next) {
      return {
        id: 'mm-' + id, label: label, value: value, aria: label + ': ' + value + '. Toque para trocar',
        next: function () { var n = Object.assign({}, f); n[id] = next(f[id]); self.setState({ f: n }); },
        style: 'display: flex; align-items: center; justify-content: space-between; gap: 8px; width: ' + w + 'px; height: 36px; padding: 0 10px 0 12px; box-sizing: border-box; border: 0; border-radius: 10px; background: #262C2A; color: #EEE8E2; font-size: 13px; font-weight: 500; text-align: left; cursor: pointer;'
      };
    };
    return { themeVars: __th.vars,
      accent: this.props.accent ?? 'var(--acc)',
      countText: rows.length + ' / 64',
      rows: rows,
      fields: [
        field('ch', 'MIDI CH', String(f.ch + 1), 96, function (v) { return (v + 1) % 16; }),
        field('cc', 'CC', String(f.cc), 88, function (v) { return v >= 127 ? 0 : v + 1; }),
        field('fn', 'Função', FN[f.fn], 180, function (v) { return (v + 1) % FN.length; }),
        field('opt', 'Opção', OPT[f.opt], 130, function (v) { return (v + 1) % OPT.length; })
      ],
      addLabel: full ? 'Limite desta tela' : 'Adicionar linha',
      addStyle: 'height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border: 0; border-radius: 10px; background: #39413E; color: ' + (full ? '#A4A698' : '#EEE8E2') + '; font-size: 13px; font-weight: 600; cursor: ' + (full ? 'default' : 'pointer') + '; white-space: nowrap',
      add: function () {
        if (full) return;
        var src = 'CC ' + f.cc;
        var added = self.state.added.filter(function (r) { return r.src !== src; }).concat([{ src: src, fn: FN[f.fn], opt: OPT[f.opt] }]);
        var g = Object.assign({}, gone); delete g[src];
        self.setState({ added: added, gone: g, f: Object.assign({}, f, { cc: f.cc >= 127 ? 0 : f.cc + 1 }) });
      }
    };
  }
}
</script>
</body>
</html>

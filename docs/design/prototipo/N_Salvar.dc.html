<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SonicMaster - salvar preset (novo design)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#3E2C28}
button{font-family:inherit;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid #DF9D8E;outline-offset:2px}
</style>
</helmet>
<div style="{{themeVars}} position: relative; width: 1180px; height: 820px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, sans-serif">
<dc-import name="N_Principal" accent="{{accent}}" hint-size="1180px,820px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="dlg-title" style="width: 380px; box-sizing: border-box; background: var(--card); border: 1px solid var(--line2); border-radius: 20px; padding: 24px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 18px">
<h2 id="dlg-title" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Salvar preset</h2>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<span id="slot-label" style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted)">SLOT</span>
<button type="button" onClick="{{toggleMenu}}" aria-labelledby="slot-label" aria-haspopup="listbox" aria-expanded="{{menuOpen}}" style="display: flex; align-items: center; justify-content: space-between; height: 42px; padding: 0 12px 0 14px; border: 0; border-radius: 10px; background: var(--ctrl); color: var(--text); cursor: pointer">
<span style="display: flex; align-items: center; gap: 10px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: {{accent}}">{{cur.id}}</span><span style="font-size: 14px; color: var(--text2)">{{cur.name}}</span></span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5" aria-hidden="true" style="stroke: var(--muted)"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="listbox" aria-labelledby="slot-label" style="position: absolute; top: 72px; left: 0; right: 0; z-index: 20; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--field); border: 1px solid var(--line2); border-radius: 12px; padding: 6px; box-shadow: 0 20px 40px rgba(0,0,0,0.5)">
<sc-for list="{{slots}}" as="it" hint-placeholder-count="14"><button type="button" role="option" onClick="{{it.pick}}" style="{{it.style}}"><span style="font-family: 'JetBrains Mono', monospace; color: {{accent}}">{{it.id}}</span><span>{{it.name}}</span></button></sc-for>
</div>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="preset-name" style="font-size: 11px; font-weight: 600; letter-spacing: 1px; color: var(--muted)">NOME DO PRESET</label>
</div>
<input id="preset-name" type="text" value="{{cur.name}}" maxlength="10" style="height: 42px; padding: 0 14px; box-sizing: border-box; border: 1px solid {{accent}}; border-radius: 10px; background: var(--ctrl); color: var(--text); font-family: Inter, sans-serif; font-size: 15px; outline: none">
<span style="font-size: 12px; color: var(--muted)">Máximo de 10 caracteres.</span>
</div>
<div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px">
<button type="button" style="height: 40px; min-width: 100px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--ctrl); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer">Cancelar</button>
<button type="button" style="height: 40px; min-width: 100px; padding: 0 18px; border: 0; border-radius: 10px; background: {{accent}}; color: var(--onacc); font-size: 14px; font-weight: 600; cursor: pointer">Salvar</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#DF9D8E","options":["#DF9D8E","#D9AB9A","#9FBF8F","#9FAD9F"]},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.__listen();
  }
  // The app colour chosen in Aparência, shared by every screen (saved in this browser).
  __listen() {
    var self = this;
    try {
      window.addEventListener('storage', function (e) { if (e.key === 'sm_tema') self.setState({ __tema: e.newValue }); });
      window.addEventListener('sm_tema', function (e) { self.setState({ __tema: e.detail }); });
    } catch (e) {}
  }
  __theme() {
    var THEMES = [{id:'vintage',c:['#3E2C28','#45322D','#4A3530','#513A35','#573E39','#5E443E','#694B45','#74534C','#835E56','#F0ECE9','#E1D9D2','#D0C7C3','#9FBF8F','#DF9D8E','#312320','#D0C7C3','#FFFFFF']},{id:'p1',c:['#392F22','#403426','#443828','#4B3D2C','#504230','#574733','#614F39','#6B5840','#796348','#F9F9FB','#F4F3F6','#CEC9C6','#9FBF8F','#D8A86A','#2E251B','#CEC9C6','#FFFFFF']},{id:'p2',c:['#3A2F1A','#41341E','#453820','#4C3D23','#524225','#594728','#63502D','#6D5832','#7B6338','#F3EBE1','#E5D2BC','#D4C7B6','#9FBF8F','#C3AC84','#2F2515','#D4C7B6','#FFFFFF']},{id:'p3',c:['#2F3315','#343917','#383D19','#3D421B','#42471D','#484D21','#50562B','#595E36','#656A45','#FAF5DE','#F5EABD','#CECAAA','#9FBF8F','#FF8C8C','#262911','#CECAAA','#FFFFFF']},{id:'p4',c:['#422A26','#4A2F2B','#4F332D','#573732','#5D3C36','#65413A','#714841','#7D5048','#8D5A51','#F1F4E6','#E4E9CD','#D0CABC','#9FBF8F','#D5A49C','#35221F','#D0CABC','#FFFFFF']},{id:'p5',c:['#4D2521','#552A26','#582E2B','#5D3431','#613A36','#66403D','#6E4946','#755350','#7F5F5C','#FFFDFF','#FEFBFF','#D2C5C6','#9FBF8F','#FFAACF','#3E1D1B','#D2C5C6','#FFFFFF']},{id:'p6',c:['#3E2C28','#45322D','#4A3530','#513A35','#573E39','#5E443E','#694B45','#74534C','#835E56','#F0ECE9','#E1D9D2','#D0C7C3','#9FBF8F','#DF9D8E','#312320','#D0C7C3','#FFFFFF']},{id:'p7',c:['#303126','#36372A','#393B2D','#3F4031','#444635','#494B3A','#525440','#5B5D47','#666950','#F6F7FA','#EDEEF5','#C7C8C7','#9FBF8F','#B8BF80','#26271E','#C7C8C7','#FFFFFF']},{id:'p8',c:['#482727','#502C2C','#543030','#583636','#5D3B3B','#624141','#694B4B','#715454','#7B6060','#EEECEB','#D9D5D1','#CFC6C4','#9FBF8F','#BDA9AC','#3A1F1F','#CFC6C4','#FFFFFF']},{id:'p9',c:['#48272D','#502B32','#562E35','#5E333A','#65373F','#6D3B44','#7A424C','#874954','#95545F','#EFECEC','#D9D2D2','#D3C7C9','#9FBF8F','#D2A1AA','#3A1F24','#D3C7C9','#FFFFFF']},{id:'p10',c:['#353027','#3B362C','#3F392F','#453F33','#4A4337','#50493B','#595242','#635A49','#706653','#F4EBE1','#E6D2BC','#D0C6B9','#9FBF8F','#D9BC9A','#2A261F','#D0C6B9','#FFFFFF']},{id:'p11',c:['#45282D','#4D2D33','#513136','#56373C','#5A3C41','#5F4247','#674B50','#6F5459','#796165','#E9F2F1','#D4E5E3','#C8C9C9','#9FBF8F','#DE9DB2','#372024','#C8C9C9','#FFFFFF']},{id:'p12',c:['#4B2623','#532B27','#592D29','#61322D','#693531','#713A35','#7E403B','#8C4741','#9E5049','#F3EBE2','#E4D2BE','#D7C4BA','#9FBF8F','#EE9898','#3C1F1C','#D7C4BA','#FFFFFF']},{id:'p13',c:['#541E2B','#592532','#5D2A36','#61303C','#663641','#6B3C48','#724651','#7A4F5A','#835C66','#F1F1E8','#E4E3D1','#D1C6C1','#9FBF8F','#C4A8AF','#441823','#D1C6C1','#FFFFFF']},{id:'p14',c:['#432B20','#4B3023','#503326','#573829','#5E3C2C','#664130','#724836','#7E503B','#875D4A','#F0EFEF','#E1DEDF','#CFC5C2','#9FBF8F','#D8B483','#362219','#CFC5C2','#FFFFFF']},{id:'p15',c:['#2F3037','#34363E','#383A42','#3D3F48','#42444E','#474954','#4F525E','#585B68','#636676','#FFFCF2','#FFF9E5','#CCCAC2','#9FBF8F','#EE9872','#25272C','#CCCAC2','#FFFFFF']},{id:'p16',c:['#26323C','#2C3741','#303B45','#36414A','#3B454F','#414B54','#4A545C','#535C65','#5F686F','#F7F7F7','#EFEFEF','#C6C9CB','#9FBF8F','#C6A8A5','#1D2831','#C6C9CB','#FFFFFF']},{id:'p17',c:['#402D16','#483219','#4D351A','#543A1D','#5A3F1F','#624422','#6D4C25','#79542A','#875F30','#FAF9F0','#F5F3E1','#D2C9B7','#9FBF8F','#C9AB89','#332412','#D2C9B7','#FFFFFF']}];
    var KEYS = ['bg', 'side', 'head', 'card', 'field', 'ctrl', 'line', 'line2', 'sel', 'text', 'text2', 'muted', 'ok', 'acc', 'onacc', 'faint', 'strong'];
    var saved = null;
    try { saved = localStorage.getItem('sm_tema'); } catch (e) {}
    var id = (this.state && this.state.__tema) || this.props.tema || saved || 'vintage';
    var t = THEMES.filter(function (x) { return x.id === id; })[0] || THEMES[0];
    return { accent: t.c[13], vars: KEYS.map(function (k, i) { return '--' + k + ': ' + t.c[i] + ';'; }).join(' ') };
  }

  renderVals() {
    var __th = this.__theme();
    var self = this, s = this.state || {};
    var slot = s.slot == null ? 4 : s.slot;
    var names = ['Clean', 'CLNGilmour', 'Lead 800', 'Tropicana', 'Djent Bass', 'Dotted08', 'DodgeBlues', 'Queen', 'JMLeadTone', 'AcousticSD', 'Slap Bass', 'Space Bass', 'MB-Thall-C', 'UniDirtDLY'];
    var id = function (i) { return 'P' + (i < 9 ? '0' : '') + (i + 1); };
    return { themeVars: __th.vars,
      accent: this.props.accent ?? 'var(--acc)',
      menuOpen: !!s.menu,
      toggleMenu: function () { self.setState({ menu: !s.menu }); },
      cur: { id: id(slot), name: names[slot] },
      slots: names.map(function (n, i) {
        return {
          id: id(i), name: n,
          pick: function () { self.setState({ slot: i, menu: false }); },
          style: 'display: flex; gap: 10px; align-items: center; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; font-size: 13px; text-align: left; cursor: pointer; color: #EEE8E2; background: ' + (i === slot ? '#39413E' : 'transparent')
        };
      })
    };
  }
}
</script>
</body>
</html>
